title: Demostraciones de Machine Learning
author: "Tu nombre"
copyright: "2026"
logo: ""
only_build_toc_files: true

execute:
  execute_notebooks: force
  timeout: 300

parse:
  myst_enable_extensions:
    - amsmath
    - dollarmath
    - colon_fence
    - deflist
    - substitution

sphinx:
  extra_extensions:
    - sphinx_proof
  config:
    language: es
    html_static_path: ["_static"]
    html_css_files: ["custom.css"]
    nb_code_prompt_show: "Mostrar código"
    nb_code_prompt_hide: "Ocultar código"
    html_show_copyright: false
    numfig: true
    numfig_secnum_depth: 0
    math_numfig: true
    mathjax3_config:
      tex:
        macros:
          bx: "\\boldsymbol{x}"
          by: "\\boldsymbol{y}"
          bv: "\\boldsymbol{v}"
          bu: "\\boldsymbol{u}"
          bb: "\\boldsymbol{b}"
          ba: "\\boldsymbol{a}"
          bc: "\\boldsymbol{c}"
          br: "\\boldsymbol{r}"
          bs: "\\boldsymbol{s}"
          bw: "\\boldsymbol{w}"
          bmu: "\\boldsymbol{\\mu}"
          beps: "\\boldsymbol{\\varepsilon}"
          bbeta: "\\boldsymbol{\\beta}"
          bgamma: "\\boldsymbol{\\gamma}"
          E: "\\mathbb{E}"
          Prob: "\\mathbb{P}"
          Ind: "\\mathbb{I}"
          Dist: "\\mathcal{D}"
          T: "\\mathsf{T}"
          uno: "\\mathbf{1}"
          cero: "\\mathbf{0}"
          sgn: "\\operatorname{sgn}"
          tr: "\\operatorname{tr}"
          Cov: "\\operatorname{Cov}"
          rg: "\\operatorname{rg}"

html:
  use_issues_button: false
  use_repository_button: false
  home_page_in_navbar: true
